name: Unit Test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  linter-and-unit:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "^22.23.4"
          - node-version: "^24.22.1"
          - node-version: "^26.13.0"
            report: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Unit test and save results
        env:
          TEST_REPORT: ${{ matrix.report && 'true' || '' }}
        run: pnpm run test

      - name: Upload test results
        if: ${{ !cancelled() && matrix.report }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.report }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
