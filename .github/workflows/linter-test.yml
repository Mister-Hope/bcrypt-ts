name: Build and Linter Test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-linter:
    name: Build and Linter test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.20.0

      - name: Install Deps
        run: pnpm ci

      - name: Build project
        env:
          BUNDLE_ANALYSIS: true
        run: pnpm run build

      - name: Linter test
        run: |
          pnpm run lint:check
